<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Organisation dashboard</title>
  <meta name="description" content="The LoosenUp organisation dashboard: anonymous weekly pulses, shown only for groups of 5 or more.">
  <meta name="theme-color" content="#EDF7FF">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css">
  <script src="/theme.js"></script>
  <style>
    .org-page { display: flex; flex-direction: column; gap: 16px; padding: 6px 0 24px; }
    .org-page ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
    .org-page .field { display: grid; gap: 6px; }
    .org-page select { min-height: 48px; border-radius: 14px; border: 1px solid var(--line); padding: 0 12px; font: inherit; background: var(--glass); color: var(--ink); }
    .code-box { font: 800 30px/1.1 var(--display); letter-spacing: .08em; padding: 14px; border-radius: 16px; background: var(--dawn); text-align: center; color: var(--ink); }
    .key-box { font: 600 14px/1.4 ui-monospace, Menlo, monospace; word-break: break-all; padding: 12px; border-radius: 12px; background: var(--glass); border: 1px dashed var(--line); }
    .price-row { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding: 8px 0; }
    .weeks { display: grid; gap: 10px; }
    .week { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .week h3 { grid-column: 1 / -1; margin: 0; font: 800 15px/1.2 var(--ui); }
    .stat { padding: 10px; border-radius: 14px; background: var(--glass); border: 1px solid var(--line); }
    .stat b { display: block; font: 700 22px/1.1 var(--display); }
    .stat span { font-size: 13px; color: var(--ink-2); }
    .stat.wide { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"><span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span></div>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="/" style="color: inherit; text-decoration: none;">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <path d="M20 2.5C28.6 2.5 34.5 8.4 34.5 15.6 34.5 21.6 28.9 25.4 24.3 29.6H15.7C11.1 25.4 5.5 21.6 5.5 15.6 5.5 8.4 11.4 2.5 20 2.5Z" fill="#F2A72B"/>
          <path d="M20 2.5C25.4 2.5 29 8.4 29 15.6 29 21.4 25.9 25.4 23.2 29.6H16.8C14.1 25.4 11 21.4 11 15.6 11 8.4 14.6 2.5 20 2.5Z" fill="#FFC857"/>
          <path d="M20 2.5C23.3 2.5 25 8.4 25 15.6 25 21.4 23.1 25.4 21.6 29.6H18.4C16.9 25.4 15 21.4 15 15.6 15 8.4 16.7 2.5 20 2.5Z" fill="#FFB088"/>
          <rect x="15.4" y="29" width="9.2" height="2.2" rx="1" fill="#F2A72B"/>
          <path d="M16.2 31.2l1 3.3M23.8 31.2l-1 3.3" stroke="#8A6B4A" stroke-width="0.9" stroke-linecap="round"/>
          <rect x="16.4" y="34.2" width="7.2" height="4.3" rx="1.2" fill="#2E7D5B"/>
        </svg>
        <span class="wordmark">LoosenUp</span>
      </a>
    </header>
    <main class="org-page">
      <p class="eyebrow">Organisation dashboard</p>
      <h1 class="title" id="d-name">Your dashboard</h1>
      <article class="card" id="key-card">
        <label class="field"><span class="field-label">Admin key</span><input id="d-key" class="text-input" type="password" autocomplete="off"></label>
        <button id="d-open" class="btn btn-sun" type="button">Open dashboard</button>
        <p id="d-status" class="fine" aria-live="polite"></p>
      </article>
      <article class="card" id="d-info" hidden>
        <p class="muted">Join code for members</p>
        <p id="d-code" class="code-box"></p>
        <p id="d-support" class="fine"></p>
      </article>
      <section id="d-weeks" class="weeks" aria-label="Weekly pulse"></section>
      <p class="fine" id="d-note" hidden>Each week shows only when 5 or more people shared it. Mood is from 1 (very heavy) to 5 (bright).</p>
      <button id="d-delete" class="btn btn-ghost" type="button" hidden>Delete this organisation and all its pulses</button>
      <a class="btn btn-ghost" href="/teams.html">About LoosenUp for organisations</a>
    </main>
    <p class="footnote">A wellbeing companion, not medical care.</p>
  </div>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var key = (location.hash.match(/key=([^&]+)/) || [])[1];
      key = key ? decodeURIComponent(key) : '';
      // Keep the admin key out of the address bar and browser history; remember it for this tab only.
      try {
        if (key) { sessionStorage.setItem('lu-admin', key); history.replaceState(null, '', location.pathname); }
        else key = sessionStorage.getItem('lu-admin') || '';
      } catch (e) { /* storage blocked: the key still works for this visit */ }
      function stat(v, label, wide) { var d = document.createElement('div'); d.className = 'stat' + (wide ? ' wide' : ''); var b = document.createElement('b'); b.textContent = v; var s = document.createElement('span'); s.textContent = label; d.appendChild(b); d.appendChild(s); return d; }
      function load() {
        if (!key) return;
        $('d-status').textContent = 'Loading...';
        fetch('/api/org?action=dashboard', { headers: { 'X-Admin-Key': key } })
          .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error); return j; }); })
          .then(function (j) {
            $('key-card').hidden = true; $('d-info').hidden = false; $('d-note').hidden = false; $('d-delete').hidden = false;
            $('d-name').textContent = j.name;
            $('d-code').textContent = j.joinCode;
            $('d-support').textContent = j.supportPhone ? 'Support line shown in members\' SOS: ' + (j.supportName || j.name) + ', ' + j.supportPhone : 'No support line added.';
            var box = $('d-weeks'); box.textContent = '';
            if (!j.weeks.length) { var p = document.createElement('p'); p.className = 'muted'; p.textContent = 'No pulses yet. Members share one a week once they turn sharing on.'; box.appendChild(p); }
            j.weeks.forEach(function (w) {
              var a = document.createElement('article'); a.className = 'card week';
              var h = document.createElement('h3'); h.textContent = 'Week ' + w.week; a.appendChild(h);
              if (w.hidden) { a.appendChild(stat('Private', 'Fewer than ' + j.minGroup + ' people shared this week', true)); }
              else {
                a.appendChild(stat(w.members, 'people shared'));
                a.appendChild(stat(w.breaks, 'calm breaks'));
                a.appendChild(stat(w.mood == null ? 'None' : w.mood + ' / 5', 'average mood'));
                a.appendChild(stat(w.calmGain == null ? 'None' : (w.calmGain >= 0 ? '+' : '') + w.calmGain, 'average Calm gain'));
                a.appendChild(stat(w.topFeelings.length ? w.topFeelings.join(', ') : 'None', 'top feelings', true));
              }
              box.appendChild(a);
            });
            $('d-status').textContent = '';
          })
          .catch(function (e) { $('key-card').hidden = false; $('d-status').textContent = (e && e.message) || 'Please try again.'; });
      }
      $('d-open').addEventListener('click', function () { key = $('d-key').value.trim(); load(); });
      $('d-delete').addEventListener('click', function () {
        if (!window.confirm('Delete this organisation and every pulse? Members keep everything on their phones. This cannot be undone.')) return;
        fetch('/api/org', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Key': key }, body: JSON.stringify({ action: 'delete' }) })
          .then(function (r) { if (r.ok) { document.querySelector('main').innerHTML = '<p class="lead">The organisation and its pulses were deleted.</p>'; } });
      });
      load();
    })();
  </script>
</body>
</html>
